<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5ebe0"/>
      <stop offset="100%" stop-color="#e8d5be"/>
    </radialGradient>
    <radialGradient id="cA" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="40%" stop-color="#d49018"/>
      <stop offset="80%" stop-color="#8a5800"/>
      <stop offset="100%" stop-color="#5a3600"/>
    </radialGradient>
    <radialGradient id="cB" cx="40%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#fff0b0"/>
      <stop offset="35%" stop-color="#e09820"/>
      <stop offset="75%" stop-color="#946010"/>
      <stop offset="100%" stop-color="#5e3a00"/>
    </radialGradient>
    <radialGradient id="cC" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff8c0"/>
      <stop offset="28%" stop-color="#f5c842"/>
      <stop offset="68%" stop-color="#d4900a"/>
      <stop offset="100%" stop-color="#8a5600"/>
    </radialGradient>
    <filter id="coinShadow">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#3d1c02" flood-opacity="0.35"/>
    </filter>
    <filter id="starGlow2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bgClip">
      <rect x="0" y="0" width="200" height="200" rx="30"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="30" fill="url(#bg2)"/>
  <rect x="0" y="0" width="200" height="200" rx="30" fill="none" stroke="#7c5c3d" stroke-width="2.5" opacity="0.65"/>

  <g clip-path="url(#bgClip)">

    <!-- Coin 1: Back-left, tilted -20° -->
    <g transform="rotate(-20, 66, 88)" filter="url(#coinShadow)">
      <ellipse cx="66" cy="93" rx="43" ry="7" fill="#3d1c02" opacity="0.5"/>
      <circle cx="66" cy="88" r="43" fill="url(#cA)"/>
      <circle cx="66" cy="88" r="37" fill="none" stroke="#5a3600" stroke-width="1.8" opacity="0.55"/>
      <text x="66" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="27" font-weight="bold"
            fill="#5a3600" opacity="0.45">€</text>
      <ellipse cx="52" cy="75" rx="14" ry="9" fill="white" opacity="0.11" transform="rotate(-22, 52, 75)"/>
    </g>

    <!-- Coin 2: Back-right, tilted +16° -->
    <g transform="rotate(16, 136, 74)" filter="url(#coinShadow)">
      <ellipse cx="136" cy="79" rx="39" ry="7" fill="#3d1c02" opacity="0.45"/>
      <circle cx="136" cy="74" r="39" fill="url(#cB)"/>
      <circle cx="136" cy="74" r="33" fill="none" stroke="#5a3600" stroke-width="1.8" opacity="0.55"/>
      <!-- Small star mark in dark brown -->
      <polygon
        points="136,59 139.1,68.7 149.4,68.7 141.5,75 144.6,84.7 136,78.5 127.4,84.7 130.5,75 122.6,68.7 132.9,68.7"
        fill="#3d1c02" opacity="0.55"/>
      <ellipse cx="124" cy="62" rx="12" ry="7.5" fill="white" opacity="0.11" transform="rotate(-15, 124, 62)"/>
    </g>

    <!-- Coin 3: Front-center, upright and largest -->
    <ellipse cx="100" cy="124" rx="53" ry="9" fill="#3d1c02" opacity="0.4"/>
    <circle cx="100" cy="116" r="53" fill="url(#cC)" filter="url(#coinShadow)"/>
    <circle cx="100" cy="116" r="46" fill="none" stroke="#7a4800" stroke-width="2.5" opacity="0.6"/>
    <!-- Star in dark brown -->
    <polygon
      points="100,88 107.05,106.29 126.62,107.35 111.41,119.71 116.45,138.65 100,128 83.55,138.65 88.59,119.71 73.38,107.35 92.95,106.29"
      fill="#3d1c02" opacity="0.88" filter="url(#starGlow2)"/>
    <ellipse cx="83" cy="101" rx="18" ry="11" fill="white" opacity="0.13" transform="rotate(-26, 83, 101)"/>
    <circle cx="100" cy="116" r="53" fill="none" stroke="rgba(255,240,150,0.2)" stroke-width="1.2"/>

  </g>

  <!-- Corner sparkles -->
  <circle cx="22" cy="42" r="2.6" fill="#7c5c3d" opacity="0.7"/>
  <circle cx="15" cy="32" r="1.5" fill="#7c5c3d" opacity="0.4"/>
  <circle cx="30" cy="32" r="1.5" fill="#7c5c3d" opacity="0.4"/>
  <circle cx="178" cy="42" r="2.6" fill="#7c5c3d" opacity="0.7"/>
  <circle cx="171" cy="32" r="1.5" fill="#7c5c3d" opacity="0.4"/>
  <circle cx="185" cy="32" r="1.5" fill="#7c5c3d" opacity="0.4"/>
  <circle cx="28"  cy="168" r="2.2" fill="#a0785a" opacity="0.6"/>
  <circle cx="172" cy="168" r="2.2" fill="#a0785a" opacity="0.6"/>
</svg>
